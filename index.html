<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Finder</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f5f5f5;
      --surface: #ffffff;
      --text: #1f2933;
      --accent: #2563eb;
      --muted: #6b7280;
      --border: #e5e7eb;
      font-size: 16px;
    }

    body.dark-mode {
      --background: #111827;
      --surface: #1f2937;
      --text: #f9fafb;
      --accent: #60a5fa;
      --muted: #9ca3af;
      --border: #374151;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: "Pretendard", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background 0.3s ease, color 0.3s ease;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem clamp(1rem, 4vw, 2rem);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    header h1 {
      flex: 1 0 150px;
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
    }

    .controls {
      display: flex;
      flex: 2 1 320px;
      gap: 0.75rem;
      align-items: center;
    }

    .controls label {
      flex: 1 1 220px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .controls input[type="search"] {
      width: 100%;
      padding: 0.65rem 2.5rem 0.65rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--background);
      color: inherit;
      outline: none;
    }

    .controls input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent);
    }

    .search-icon {
      position: absolute;
      right: 0.75rem;
      pointer-events: none;
      font-size: 1.1rem;
      color: var(--muted);
    }

    button {
      cursor: pointer;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: inherit;
      padding: 0.5rem 0.9rem;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button:hover {
      background: color-mix(in srgb, var(--accent) 14%, var(--surface));
      border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
    }

    button:active {
      transform: scale(0.98);
    }

    main {
      padding: 1.5rem clamp(1rem, 4vw, 2rem) 3rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .status {
      margin-top: 2rem;
      display: grid;
      place-items: center;
      text-align: center;
      gap: 0.75rem;
      color: var(--muted);
    }

    ul.post-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 1rem;
    }

    li.post-item {
      background: var(--surface);
      border-radius: 1rem;
      border: 1px solid var(--border);
      padding: 1rem clamp(1rem, 4vw, 1.5rem);
      box-shadow: 0 10px 25px -18px rgba(15, 23, 42, 0.4);
    }

    li.post-item:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent);
    }

    .post-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .post-title {
      font-size: 1.1rem;
      margin: 0;
    }

    .favorite-button {
      border-radius: 999px;
      min-width: 2.2rem;
      justify-content: center;
      font-size: 1.25rem;
      background: transparent;
      border: none;
      color: #d1d5db;
    }

    .favorite-button[aria-pressed="true"] {
      color: #f59e0b;
    }

    .favorite-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .favorite-button:hover {
      background: color-mix(in srgb, #fbbf24 10%, var(--surface));
    }

    .post-body {
      margin: 0;
      line-height: 1.6;
      color: color-mix(in srgb, var(--text) 85%, var(--muted));
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Post Finder</h1>
    <div class="controls" role="search">
      <label for="search" aria-label="게시글 검색">
        <span class="sr-only">검색</span>
        <input id="search" type="search" name="search" placeholder="제목 또는 본문 검색" autocomplete="off" />
        <span class="search-icon" aria-hidden="true">🔍</span>
      </label>
      <button id="darkToggle" type="button" aria-pressed="false" aria-label="다크 모드 전환">
        🌗 다크 모드
      </button>
      <button id="favoritesFilter" type="button" aria-pressed="false">
        ⭐️ 즐겨찾기만 보기
      </button>
    </div>
  </header>

  <main>
    <section aria-live="polite" aria-atomic="true">
      <div id="status" class="status" role="status" hidden></div>
      <ul id="postList" class="post-list" aria-label="게시글 목록"></ul>
    </section>
  </main>

  <template id="postTemplate">
    <li class="post-item">
      <article tabindex="-1">
        <div class="post-header">
          <h2 class="post-title"></h2>
          <button class="favorite-button" type="button" aria-pressed="false" aria-label="즐겨찾기">
            ⭐️
          </button>
        </div>
        <p class="post-body"></p>
      </article>
    </li>
  </template>

  <script>
    (function () {
      const API_URL = "https://jsonplaceholder.typicode.com/posts";
      const CHUNK_SIZE = 10;
      const searchInput = document.getElementById("search");
      const postList = document.getElementById("postList");
      const statusEl = document.getElementById("status");
      const darkToggle = document.getElementById("darkToggle");
      const favoritesFilterBtn = document.getElementById("favoritesFilter");
      const postTemplate = document.getElementById("postTemplate");

      let allPosts = [];
      let filteredPosts = [];
      let visibleCount = 0;
      let favorites = new Set();
      let isFilteringFavorites = false;
      let isLoading = false;
      let debounceTimer = null;

      const FAVORITES_KEY = "post-finder:favorites";
      const THEME_KEY = "post-finder:dark-mode";

      function setStatus(message, options = {}) {
        const { isError = false, showSpinner = false } = options;
        if (!message) {
          statusEl.hidden = true;
          statusEl.textContent = "";
          statusEl.removeAttribute("data-error");
          return;
        }
        statusEl.hidden = false;
        statusEl.innerHTML = `${showSpinner ? '<span aria-hidden="true">⏳</span>' : ""}<span>${message}</span>`;
        if (isError) {
          statusEl.setAttribute("data-error", "true");
          statusEl.style.color = "#ef4444";
        } else {
          statusEl.removeAttribute("data-error");
          statusEl.style.color = "var(--muted)";
        }
      }

      function loadFavorites() {
        try {
          const raw = localStorage.getItem(FAVORITES_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              favorites = new Set(parsed);
            }
          }
        } catch (error) {
          console.warn("즐겨찾기를 불러오는 중 문제가 발생했습니다.", error);
        }
      }

      function saveFavorites() {
        try {
          localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(favorites)));
        } catch (error) {
          console.warn("즐겨찾기를 저장하는 중 문제가 발생했습니다.", error);
        }
      }

      function loadTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "true") {
          document.body.classList.add("dark-mode");
          darkToggle.setAttribute("aria-pressed", "true");
        }
      }

      function toggleDarkMode() {
        const isDark = document.body.classList.toggle("dark-mode");
        darkToggle.setAttribute("aria-pressed", String(isDark));
        localStorage.setItem(THEME_KEY, String(isDark));
      }

      function toggleFavorite(postId) {
        if (favorites.has(postId)) {
          favorites.delete(postId);
        } else {
          favorites.add(postId);
        }
        saveFavorites();
        updateFavoritesIndicators();
        if (isFilteringFavorites) {
          applyFilters();
        }
      }

      function updateFavoritesIndicators() {
        postList.querySelectorAll(".favorite-button").forEach((button) => {
          const id = Number(button.dataset.id);
          const isFav = favorites.has(id);
          button.setAttribute("aria-pressed", String(isFav));
        });
      }

      function getFilteredPosts() {
        const query = searchInput.value.trim().toLowerCase();
        const base = isFilteringFavorites
          ? allPosts.filter((post) => favorites.has(post.id))
          : allPosts;
        if (!query) {
          return base;
        }
        return base.filter((post) => {
          const haystack = `${post.title} ${post.body}`.toLowerCase();
          return haystack.includes(query);
        });
      }

      function clearPosts() {
        postList.innerHTML = "";
      }

      function renderPosts(upTo) {
        clearPosts();
        const fragment = document.createDocumentFragment();
        const slice = filteredPosts.slice(0, upTo);
        slice.forEach((post) => {
          const clone = postTemplate.content.cloneNode(true);
          const listItem = clone.querySelector("li");
          const article = clone.querySelector("article");
          const titleEl = clone.querySelector(".post-title");
          const bodyEl = clone.querySelector(".post-body");
          const favoriteButton = clone.querySelector(".favorite-button");

          listItem.id = `post-${post.id}`;
          article.setAttribute("aria-labelledby", `title-${post.id}`);
          article.setAttribute("aria-describedby", `body-${post.id}`);
          article.setAttribute("tabindex", "0");

          titleEl.id = `title-${post.id}`;
          titleEl.textContent = post.title;
          bodyEl.id = `body-${post.id}`;
          bodyEl.textContent = post.body;

          favoriteButton.dataset.id = post.id;
          favoriteButton.setAttribute("aria-label", `${favorites.has(post.id) ? "즐겨찾기 해제" : "즐겨찾기"}: ${post.title}`);
          favoriteButton.setAttribute("aria-pressed", String(favorites.has(post.id)));
          favoriteButton.addEventListener("click", (event) => {
            event.stopPropagation();
            event.preventDefault();
            toggleFavorite(post.id);
            favoriteButton.setAttribute("aria-label", `${favorites.has(post.id) ? "즐겨찾기 해제" : "즐겨찾기"}: ${post.title}`);
          });

          fragment.appendChild(clone);
        });
        postList.appendChild(fragment);
      }

      function applyFilters() {
        filteredPosts = getFilteredPosts();
        visibleCount = Math.min(filteredPosts.length, Math.max(CHUNK_SIZE, visibleCount));
        if (visibleCount === 0 && filteredPosts.length > 0) {
          visibleCount = Math.min(CHUNK_SIZE, filteredPosts.length);
        }
        if (filteredPosts.length === 0) {
          clearPosts();
          setStatus("조건에 맞는 게시글이 없습니다.");
        } else {
          setStatus("");
          renderPosts(visibleCount);
          updateFavoritesIndicators();
        }
      }

      function showError(message) {
        setStatus(message, { isError: true });
        const retryButton = document.createElement("button");
        retryButton.type = "button";
        retryButton.textContent = "다시 시도";
        retryButton.addEventListener("click", () => {
          fetchPosts();
        });
        statusEl.appendChild(retryButton);
      }

      async function fetchPosts() {
        if (isLoading) return;
        isLoading = true;
        setStatus("게시글을 불러오는 중입니다…", { showSpinner: true });
        try {
          const response = await fetch(API_URL);
          if (!response.ok) {
            throw new Error(`요청 실패: ${response.status}`);
          }
          const data = await response.json();
          allPosts = Array.isArray(data) ? data : [];
          visibleCount = CHUNK_SIZE;
          applyFilters();
          if (allPosts.length === 0) {
            setStatus("표시할 게시글이 없습니다.");
          }
        } catch (error) {
          console.error(error);
          showError("게시글을 불러오는 중 문제가 발생했습니다.");
        } finally {
          isLoading = false;
        }
      }

      function handleSearchInput() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          visibleCount = CHUNK_SIZE;
          applyFilters();
        }, 300);
      }

      function handleScroll() {
        if (isLoading || filteredPosts.length === 0) return;
        const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
        if (scrollTop + clientHeight >= scrollHeight - 100) {
          const newVisible = Math.min(filteredPosts.length, visibleCount + CHUNK_SIZE);
          if (newVisible !== visibleCount) {
            visibleCount = newVisible;
            renderPosts(visibleCount);
            updateFavoritesIndicators();
          }
        }
      }

      function initEventListeners() {
        searchInput.addEventListener("input", handleSearchInput);
        darkToggle.addEventListener("click", toggleDarkMode);
        favoritesFilterBtn.addEventListener("click", () => {
          isFilteringFavorites = !isFilteringFavorites;
          favoritesFilterBtn.setAttribute("aria-pressed", String(isFilteringFavorites));
          favoritesFilterBtn.textContent = isFilteringFavorites ? "⭐️ 전체 보기" : "⭐️ 즐겨찾기만 보기";
          visibleCount = CHUNK_SIZE;
          applyFilters();
        });
        window.addEventListener("scroll", handleScroll, { passive: true });
      }

      function init() {
        loadFavorites();
        loadTheme();
        initEventListeners();
        fetchPosts();
      }

      init();
    })();
  </script>
</body>
</html>
